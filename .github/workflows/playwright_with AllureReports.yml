name: Playwright Tests with Allure Reports
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code to repository
      uses: actions/checkout@v4
    - name: Setup Node.js  
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests tests/getcall.spec.js
      run: npx playwright test tests/getcall.spec.js
      continue-on-error: true
      
    #- uses: actions/upload-artifact@v4
    #  if: ${{ !cancelled() }}
    #  with:
    #    name: playwright-report
    #    path: playwright-report/
    #    retention-days: 30
    - name: Install Allure Commandline
      run: npm install -g  --save-dev allure-commandline
    - name: Allure Playwright adapter
      run: npm install -D --save-devallure-playwright

    - name: Generate Allure report
      run: npx allure serve allure-results --clean --o allure-report
    - name: Upload Allure report as artifact  
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30  
    # Tests run automatically on pushes and pull requests
    # Allure report is generated after execution
    # Allure report is uploaded as an artifact for later download and analysis