name: Playwright Tests with Allure Reports
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    #runs on playwright docker image with all browsers pre-installed
    #docker pull mcr.microsoft.com/playwright:v1.58.2-noble
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
    - name: Checkout code to repository
      uses: actions/checkout@v4
    - name: Setup Node.js  
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v3
      id: playwright-cache
      with:  
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
        path: ~/.cache/ms-playwright

    - name: Install Playwright Browsers
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps

    - name: Run Playwright tests tests/getcall.spec.js
      run: npx playwright test tests/getcall.spec.js
      continue-on-error: true

    - name: Install Java (required for Allure report generation)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'  
      
    #- uses: actions/upload-artifact@v4
    #  if: ${{ !cancelled() }}
    #  with:
    #    name: playwright-report
    #    path: playwright-report/
    #    retention-days: 30

    # Install Allure Commandline and Allure Playwright adapter
    - name: Install Allure Commandline CLI globally
      #  run: npm install -g  --save-dev allure-commandline
      run: |
        npm install -g allure-commandline
        echo "$(npm root -g)/./bin/allure"  >> $GITHUB_PATH
        echo "/user/local/bin/allure"  >> $GITHUB_PATH
        allure --version
    #- name: Allure Playwright adapter
    #  run: npm install -D --save-dev allure-playwright

    - name: Generate Allure report
      if: success() || failure()  # Generate report even if tests fail
      run: npx allure generate allure-results --clean --o allure-report

    - name: Upload Allure report as artifact  
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30  
    # Tests run automatically on pushes and pull requests
    # Allure report is generated after execution
    # Allure report is uploaded as an artifact for later download and analysis

    - name: Deploy Allure report to Netlify    
      if: ${{ always() }}      
      run: |
        npx netlify deploy \
        --site ${{ secrets.NETLIFY_SITE_ID }} \
        --prod \
        --dir allure-report
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}   